<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЧМ 2026 — Прогнозы</title>
<style>
:root {
  --bg: #0c1520;
  --surface: #162030;
  --surface2: #1e2d3e;
  --surface3: #263545;
  --accent: #00e676;
  --accent-dim: #00b356;
  --text: #e4ecf5;
  --text-dim: #7a94ae;
  --border: #263545;
  --red: #ff4757;
  --gold: #ffd700;
  --orange: #ff9f00;
  --blue: #448aff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
}

/* ---- HEADER ---- */
header {
  background: linear-gradient(160deg, #0a3d20 0%, #162030 100%);
  padding: 12px 16px;
  border-bottom: 1px solid var(--accent-dim);
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }

/* ---- NAV ---- */
nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; z-index: 100;
}
nav button {
  flex: 1; background: none; border: none; color: var(--text-dim);
  padding: 8px 4px; font-size: 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color .2s;
}
nav button .ni { font-size: 22px; line-height: 1; }
nav button.act { color: var(--accent); }

/* ---- TABS ---- */
.tab { display: none; padding: 14px; }
.tab.act { display: block; }

/* ---- SECTION LABEL ---- */
.sec-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-dim); margin: 18px 0 10px;
}
.sec-label:first-child { margin-top: 0; }

/* ---- LEADERBOARD ---- */
.lb-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  transition: border-color .2s;
}
.lb-item.first-place { border-color: var(--gold); background: linear-gradient(135deg, #1a2010, #1e2d3e); }
.lb-item.second-place { border-color: #aaa; }
.lb-item.third-place { border-color: #a0522d; }
.lb-rank { font-size: 18px; width: 30px; text-align: center; flex-shrink: 0; }
.lb-info { flex: 1; min-width: 0; }
.lb-name { font-size: 15px; font-weight: 600; }
.lb-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-pts { font-size: 24px; font-weight: 700; color: var(--accent); min-width: 44px; text-align: right; }
.lb-pts-detail { font-size: 11px; color: var(--text-dim); text-align: right; }
.leader-tag {
  font-size: 10px; font-weight: 700; background: var(--gold); color: #000;
  border-radius: 8px; padding: 2px 7px; margin-left: 6px; vertical-align: middle;
}

/* ---- MATCH CARD ---- */
.match-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px; overflow: hidden;
}
.match-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.match-group-badge {
  font-size: 11px; background: var(--surface2); color: var(--accent);
  border-radius: 8px; padding: 2px 8px; font-weight: 600;
}
.playoff-badge {
  background: linear-gradient(90deg,#2a1a00,#3a2500);
  color: var(--gold); border: 1px solid var(--gold);
}
.match-date-str { font-size: 11px; color: var(--text-dim); }
.match-teams-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.match-team-side {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; flex: 1; text-align: center;
}
.match-flag { font-size: 32px; line-height: 1; }
.match-team-name { font-size: 12px; font-weight: 600; }
.match-vs {
  font-size: 13px; color: var(--text-dim); text-align: center;
  min-width: 56px; flex-shrink: 0;
}
.match-result-score {
  font-size: 26px; font-weight: 800; color: var(--text);
  text-align: center; line-height: 1;
}
.match-result-score.live { color: #ff4757; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.pred-row {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.pred-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 4px;
}
.pred-chip .pts-badge { font-weight: 700; }
.pred-chip.pts3 { background: #0d3321; border-color: var(--accent); }
.pred-chip.pts3 .pts-badge { color: var(--accent); }
.pred-chip.pts2 { background: #2a2200; border-color: var(--gold); }
.pred-chip.pts2 .pts-badge { color: var(--gold); }
.pred-chip.pts1 { background: #2a1500; border-color: var(--orange); }
.pred-chip.pts1 .pts-badge { color: var(--orange); }
.pred-chip.pts0 { background: #2a0d0d; border-color: var(--red); }
.pred-chip.pts0 .pts-badge { color: var(--red); }
.pred-chip.pts4 { background: #0a2020; border-color: #00d4aa; }
.pred-chip.pts4 .pts-badge { color: #00d4aa; }
.pred-chip.pts5 { background: #1e1a00; border-color: #f1c40f; box-shadow: 0 0 5px #f1c40f33; }
.pred-chip.pts5 .pts-badge { color: #f1c40f; }
.pred-chip.no-bet { opacity: .45; }
.cbet-advance-sel { width:100%; margin-top:4px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:4px 6px; font-size:12px; }
.cbet-advance-disp { font-size:11px; color:var(--accent); margin-top:2px; }
.locked-badge {
  font-size: 10px; color: var(--red); border: 1px solid var(--red);
  border-radius: 6px; padding: 1px 6px; margin-left: 4px;
}

/* ---- FILTER BAR ---- */
.filter-bar {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
  margin-bottom: 14px; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 16px; padding: 5px 12px; font-size: 12px;
  color: var(--text-dim); cursor: pointer; white-space: nowrap;
  transition: all .2s;
}
.filter-btn.act { background: #0d3321; border-color: var(--accent); color: var(--accent); }

/* ---- BET FORM (legacy, kept for already-bet display) ---- */
.already-bet {
  background: #0d3321; border: 1px solid var(--accent);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--accent); text-align: center; margin-bottom: 12px;
}
.bet-score-row input {
  width: 64px; height: 56px; text-align: center; font-size: 28px; font-weight: 700;
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text);
  transition: border-color .2s;
}
.bet-score-row input:focus { border-color: var(--accent); outline: none; }
.bet-colon { font-size: 28px; font-weight: 700; color: var(--text-dim); }
.bet-meta { font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 12px; }
.already-bet {
  background: #0d3321; border: 1px solid var(--accent);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--accent); text-align: center; margin-bottom: 12px;
}

/* ---- BUTTONS ---- */
.btn {
  background: var(--accent); color: #000; border: none;
  border-radius: 10px; padding: 13px 24px; font-size: 15px; font-weight: 700;
  cursor: pointer; width: 100%; transition: opacity .2s;
}
.btn:hover { opacity: .9; }
.btn-sec {
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border);
}
.btn-sec:hover { opacity: .8; }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm {
  padding: 8px 16px; font-size: 13px; width: auto;
}

/* ---- ADMIN ---- */
.admin-lock {
  text-align: center; padding: 60px 20px;
}
.admin-pin-input {
  width: 140px; height: 56px; text-align: center;
  font-size: 28px; letter-spacing: 10px; font-weight: 700;
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text); margin: 16px auto; display: block;
}
.admin-pin-input:focus { border-color: var(--accent); outline: none; }
.admin-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; margin-bottom: 12px;
}
.admin-section-title {
  font-size: 13px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.result-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.result-row .team-name { flex: 1; font-size: 13px; }
.result-row input {
  width: 52px; height: 40px; text-align: center; font-size: 18px; font-weight: 700;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
}
.result-row input:focus { border-color: var(--accent); outline: none; }
.pick-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.pick-row .pick-player { flex: 1; font-size: 13px; font-weight: 600; }
.pick-row select {
  flex: 2; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 8px 10px; font-size: 13px;
}

/* ---- MISC ---- */
.warn-box {
  background: #2a1800; border: 1px solid var(--orange);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--orange); margin-bottom: 12px;
}
.info-box {
  background: #0d1e2a; border: 1px solid var(--blue);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--blue); margin-bottom: 12px; text-align: center;
}
.empty-state {
  text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 15px;
}
.badge-bonus {
  font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 7px;
  border: 1px solid var(--gold); color: var(--gold);
}
.badge-bonus.won { background: var(--gold); color: #000; }
.divider { height: 1px; background: var(--border); margin: 12px 0; }


/* 3-column standings grid */
.pg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.pg3-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 6px; text-align: center;
}
.pg3-card.pg3-gold { border-color: var(--gold); background: linear-gradient(160deg,#1e2a0a,#1e2d3e); }
.pg3-rank { font-size: 13px; font-weight: 700; color: var(--text-dim); line-height: 1; }
.pg3-name { font-size: 13px; font-weight: 700; margin: 5px 0 2px; }
.pg3-pts { font-size: 28px; font-weight: 800; color: var(--accent); line-height: 1; }
.pg3-sub { font-size: 10px; color: var(--text-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }

/* Multi-player bet panel */
.multi-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.multi-match-hdr { text-align: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.multi-match-teams { font-size: 16px; font-weight: 700; margin: 5px 0 3px; }
.multi-match-date { font-size: 12px; color: var(--text-dim); }

/* Compact 2-column bet grid */
.cbet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 8px 0; }
.cbet-cell {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 7px; background: var(--surface2);
  border-radius: 8px; min-height: 40px;
}
.cbet-name {
  font-size: 12px; font-weight: 600; min-width: 62px; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cbet-inputs { display: flex; align-items: center; gap: 3px; flex: 1; }
.cbet-inputs input {
  width: 32px; height: 32px; text-align: center;
  font-size: 15px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); transition: border-color .15s;
}
.cbet-inputs input:focus { border-color: var(--accent); outline: none; }
.cbet-sep { font-size: 13px; color: var(--text-dim); margin: 0 2px; }
.cbet-done { font-size: 13px; font-weight: 700; color: var(--accent); flex: 1; text-align: center; }
.btn-clear-sm {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 3px 6px; color: var(--text-dim); font-size: 11px; cursor: pointer; flex-shrink: 0;
}
.btn-clear-sm:hover { border-color: var(--red); color: var(--red); }
.btn-save-sm {
  background: var(--accent); border: none; border-radius: 6px;
  padding: 3px 8px; color: #000; font-size: 13px; font-weight: 700;
  cursor: pointer; flex-shrink: 0; line-height: 1;
}
.btn-save-sm:active { opacity: .8; }

/* Bet rows accordion (Ставки tab) */
.bet-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 6px; overflow: hidden;
}
.bet-row-hdr {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; cursor: pointer; transition: background .15s;
  -webkit-user-select: none; user-select: none;
}
.bet-row-hdr:active { background: var(--surface2); }
.bet-row-teams {
  flex: 1; font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bet-row-date { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.bet-row-count { font-size: 11px; color: var(--accent); flex-shrink: 0; min-width: 28px; text-align: right; }
.bet-row-chevron { font-size: 10px; color: var(--text-dim); transition: transform .2s; flex-shrink: 0; }
.bet-row.expanded .bet-row-chevron { transform: rotate(180deg); }
.bet-row-body {
  display: none; padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
}
.bet-row.expanded .bet-row-body { display: block; }

/* Match nav dots */
.match-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.match-nav-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--text);
}
.match-nav-btn:disabled { opacity: .3; cursor: default; }
.match-nav-info { font-size: 12px; color: var(--text-dim); }

/* Mobile tweaks for very small screens */
@media (max-width: 360px) {
  .pg3-name { font-size: 11px; }
  .pg3-pts  { font-size: 22px; }
  .cbet-name { min-width: 52px; font-size: 11px; }
  .cbet-inputs input { width: 28px; height: 28px; font-size: 13px; }
  .bet-row-teams { font-size: 12px; }
  nav button { font-size: 9px; }
}
/* Desktop centering */
@media (min-width: 600px) {
  body { max-width: 600px; margin: 0 auto; }
  nav { width: 600px; left: 50%; right: auto; transform: translateX(-50%); }
  .pg3-pts { font-size: 30px; }
  .cbet-grid { gap: 7px; }
  .cbet-inputs input { width: 36px; height: 36px; font-size: 16px; }
}
</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <div style="font-size:48px">⚽</div>
  <div style="color:var(--accent);font-size:16px;font-weight:600">Загрузка...</div>

<header>
  <div class="header-title">⚽ ЧМ 2026</div>

  <button onclick="switchTab('admin',this)"><span class="ni">⚙️</span>Админ</button>
</nav>

function normalizeData(val) {
  // Firebase turns arrays into objects with numeric keys — convert back
  if (val.matches && !Array.isArray(val.matches)) {
    val.matches = Object.values(val.matches);
  }
  if (!val.predictions)    val.predictions    = {};
  if (!val.tournamentPicks) val.tournamentPicks = {};
  if (val.tournamentPicksLocked === undefined) val.tournamentPicksLocked = false;
  if (!val.lockedBets)     val.lockedBets     = {};
  if (val.footballApiKey === undefined) val.footballApiKey = null;

  // Migration: add playoff match stubs if missing (data saved before playoff feature)
  if (val.matches && !val.matches.some(m => m.round)) {
    const playoffStubs = generateDefaultMatches().filter(m => m.round);
    val.matches = [...val.matches, ...playoffStubs];
  }

  return val;
}

function initFirebase() {
  const configured = FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY';

  if (!configured) {
    // No Firebase yet — fall back to localStorage
    try { data = JSON.parse(localStorage.getItem('wc2026')) || buildDefaultData(); }
    catch(e) { data = buildDefaultData(); }
    hideLoader();
    return;
  }

  firebase.initializeApp(FIREBASE_CONFIG);
  stateRef = firebase.database().ref('wc2026');

  stateRef.on('value', snapshot => {
    const val = snapshot.val();
    if (!val) {
      data = buildDefaultData();
      stateRef.set(data);
    } else {
      data = normalizeData(val);
    }

    if (isFirstLoad) {
      isFirstLoad = false;
      hideLoader();
      renderLeaderboard();
    } else {
      renderTab(activeTab);
    }

  }, err => {
    console.error('Firebase:', err);
    data = buildDefaultData();
    hideLoader();
  });
}

  if (stateRef) {

// ===================== BUSINESS LOGIC =====================

function calcPoints(pred, result, isPlayoff = false) {
  if (!pred || !result) return null;
  const {home:pH, away:pA} = pred;
  const {home:rH, away:rA} = result;
  let pts = 0;
  if (pH === rH && pA === rA) pts = 3;
  else if ((pH - pA) === (rH - rA)) pts = 2;
  else if (Math.sign(pH - pA) === Math.sign(rH - rA)) pts = 1;
  if (isPlayoff && result.winner && pred.advancePick && pred.advancePick === result.winner
      && result.home === result.away) pts += 2;
  return pts;
}

function getStandings(data) {
  const st = {};
  PLAYERS.forEach(p => { st[p] = {name:p, matchPts:0, bonusPts:0, team: data.tournamentPicks[p] || null}; });

  data.matches.forEach(m => {
    if (!m.result) return;
    PLAYERS.forEach(p => {
      const pred = data.predictions[`${m.id}_${p}`];
      const pts = calcPoints(pred, m.result, !!m.round);
      if (pts !== null) st[p].matchPts += pts;
    });
  });

  if (data.tournamentWinner) {
    PLAYERS.forEach(p => {
      if (data.tournamentPicks[p] === data.tournamentWinner) st[p].bonusPts += 10;
    });
  }

  return Object.values(st)
    .map(s => ({...s, total: s.matchPts + s.bonusPts}))
    .sort((a,b) => b.total - a.total);
}

function getLeaders(data) {
  const standings = getStandings(data);
  if (!standings.length) return [];
  const maxPts = standings[0].total;
  return standings.filter(s => s.total === maxPts).map(s => s.name);
}

function isLocked(match) {
  return new Date() >= new Date(match.date);
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const day = days[d.getDay()];
  const date = d.getDate();
  const mon = months[d.getMonth()];
  const h = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${day} ${date} ${mon}, ${h}:${min}`;
}

function flag(team) { return TEAMS[team] || '🏳️'; }

function getSortedMatches() {
  return [...data.matches].sort((a, b) => new Date(a.date) - new Date(b.date));
}

function getEffectiveMatchIdx() {
  const sorted = getSortedMatches();

  // Helper: index of nearest upcoming (non-locked) match
  function nearestUpcoming(fromIdx) {
    // First try from current position forward
    let idx = sorted.findIndex((m, i) => i >= fromIdx && !isLocked(m));
    if (idx >= 0) return idx;
    // Fall back to any upcoming
    idx = sorted.findIndex(m => !isLocked(m));
    return idx >= 0 ? idx : sorted.length - 1;
  }

  if (currentMatchIdx === -1) {
    return nearestUpcoming(0);
  }

  const idx = Math.max(0, Math.min(sorted.length - 1, currentMatchIdx));
  return idx;
}

        <div class="cbet-inputs">
          <input type="text" inputmode="numeric" pattern="[0-9]*" id="bh-${match.id}-${p}" value="0"
            onfocus="this.dataset.prev=this.value;this.value=''"
            onblur="if(this.value.trim()==='')this.value=this.dataset.prev||'0'"
            oninput="this.dataset.touched='1';updateAdvancePick(${match.id},'${p}')">
          <span class="cbet-sep">:</span>
          <input type="text" inputmode="numeric" pattern="[0-9]*" id="ba-${match.id}-${p}" value="0"
            onfocus="this.dataset.prev=this.value;this.value=''"
            onblur="if(this.value.trim()==='')this.value=this.dataset.prev||'0'"
            oninput="this.dataset.touched='1';updateAdvancePick(${match.id},'${p}')">
        </div>
        ${apSelect}
        <button class="btn-save-sm" onclick="saveBetFor(${match.id},'${p}')">✓</button>

      html += `<div class="cbet-cell" style="opacity:.4">
        <div class="cbet-name">${p}</div>
        <div class="cbet-done" style="color:var(--text-dim)">— нет</div>

  html += '</div>';

}

function renderMultiBetPanel(match) {
  const leaders = getLeaders(data);
  const maxPts = getStandings(data)[0]?.total ?? 0;
  const betLocked = !!(data.lockedBets?.[match.id] || isLocked(match));

  let html = `<div class="multi-card">
    <div class="multi-match-hdr">
      <span class="match-group-badge">${match.round ? (PLAYOFF_ROUNDS[match.round] || match.round) : `Группа ${match.group} · Тур ${match.md}`}</span>

      <div class="multi-match-date">⏰ ${fmtDate(match.date)}</div>
    </div>`;

  if (betLocked) {
    html += `<div class="info-box" style="margin-bottom:10px;font-size:12px">🔒 Ставки зафиксированы</div>`;
  } else if (maxPts > 0 && leaders.length) {
    html += `<div class="warn-box" style="margin-bottom:10px">⚠️ Первым ставит: <strong>${leaders[0]}</strong></div>`;
  }

  }

function moveBetMatch(dir) {
  const sorted = getSortedMatches();
  const cur = getEffectiveMatchIdx();
  currentMatchIdx = Math.max(0, Math.min(sorted.length - 1, cur + dir));
  renderLeaderboard();
}

function updateAdvancePick(matchId, player) {
  const h = parseInt(document.getElementById(`bh-${matchId}-${player}`)?.value) || 0;
  const a = parseInt(document.getElementById(`ba-${matchId}-${player}`)?.value) || 0;
  const apEl = document.getElementById(`ap-${matchId}-${player}`);
  if (apEl) apEl.style.display = (h === a) ? '' : 'none';
}

function saveBetFor(matchId, player) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m || isLocked(m)) { alert('Матч уже начался! Ставки закрыты.'); return; }
  const hEl = document.getElementById(`bh-${matchId}-${player}`);
  const aEl = document.getElementById(`ba-${matchId}-${player}`);
  if (!hEl || !aEl) return;
  const h = Math.max(0, Math.min(20, parseInt(hEl.value) || 0));
  const a = Math.max(0, Math.min(20, parseInt(aEl.value) || 0));
  const apEl = document.getElementById(`ap-${matchId}-${player}`);
  const advancePick = (apEl && h === a) ? (apEl.value || null) : null;
  data.predictions[`${matchId}_${player}`] = { home: h, away: a, advancePick, ts: Date.now() };
  saveData(data);
  renderLeaderboard();
  if (activeTab === 'matches') renderMatches();
  if (activeTab === 'bets') renderBets();
}

function submitAllBets(matchId) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m || isLocked(m)) { alert('Матч уже начался! Ставки закрыты.'); return; }

  // Check all players have placed a bet (saved or touched)
  const missing = PLAYERS.filter(p => {
    if (data.predictions[`${matchId}_${p}`]) return false;
    const hEl = document.getElementById(`bh-${matchId}-${p}`);
    return !hEl || !hEl.dataset.touched;
  });
  if (missing.length) {
    alert(`Не все сделали ставку:\n${missing.join(', ')}`);
    return;
  }

  // For playoff matches warn if advance picks are missing
  const isPlayoffMatch = !!m.round;
  const teamsKnown = isPlayoffMatch && !!TEAMS[m.home] && !!TEAMS[m.away];
  if (teamsKnown) {
    const missingAp = PLAYERS.filter(p => {
      const existing = data.predictions[`${matchId}_${p}`];
      if (existing) return existing.home === existing.away && !existing.advancePick;
      const hEl = document.getElementById(`bh-${matchId}-${p}`);
      const aEl = document.getElementById(`ba-${matchId}-${p}`);
      const h = parseInt(hEl?.value) || 0;
      const a = parseInt(aEl?.value) || 0;
      if (h !== a) return false;
      const apEl = document.getElementById(`ap-${matchId}-${p}`);
      return !apEl || !apEl.value;
    });
    if (missingAp.length && !confirm(`${missingAp.join(', ')} поставили ничью но не выбрали кто проходит (+2 очка). Продолжить?`)) return;
  }

  // Save newly touched inputs
  PLAYERS.forEach(p => {
    const hEl = document.getElementById(`bh-${matchId}-${p}`);
    const aEl = document.getElementById(`ba-${matchId}-${p}`);
    if (!hEl || !aEl) return;
    const h = Math.max(0, Math.min(20, parseInt(hEl.value) || 0));
    const a = Math.max(0, Math.min(20, parseInt(aEl.value) || 0));
    const apEl = document.getElementById(`ap-${matchId}-${p}`);
    const advancePick = (apEl && h === a) ? (apEl.value || null) : null;
    data.predictions[`${matchId}_${p}`] = { home: h, away: a, advancePick, ts: Date.now() };
  });
  data.lockedBets[matchId] = true;
  saveData(data);
  renderLeaderboard();
  if (activeTab === 'matches') renderMatches();
  if (activeTab === 'bets') renderBets();
}

function clearBetFor(matchId, player) {
  if (data.lockedBets && data.lockedBets[matchId] && !betsUnlocked) {
    alert('Ставки зафиксированы. Для изменений перейди во вкладку Ставки и введи PIN.');
    return;
  }
  delete data.predictions[`${matchId}_${player}`];
  if (data.lockedBets && data.lockedBets[matchId]) delete data.lockedBets[matchId];
  saveData(data);
  renderLeaderboard();
  if (activeTab === 'matches') renderMatches();
  if (activeTab === 'bets') renderBets();
}

    const canada = all.find(m =>

    );

    if (canada) {

      msg += `\n\nКанада/Босния:\nСтатус: ${canada.status}\nСчёт: ${canada.score?.fullTime?.home ?? '—'} : ${canada.score?.fullTime?.away ?? '—'}`;
      msg += `\nДом: name="${h.name}" short="${h.shortName}"`;

      msg += `\nМаппинг: ${API_TEAM_MAP[h.name]||API_TEAM_MAP[h.shortName]||'❌'} vs ${API_TEAM_MAP[a.name]||API_TEAM_MAP[a.shortName]||'❌'}`;
    }

}

function pushApiLog(d, desc) {
  if (!d.apiLog) d.apiLog = [];
  const ts = new Date().toISOString();
  d.apiLog.unshift({ ts, desc });
  if (d.apiLog.length > 100) d.apiLog.length = 100;
}

async function fetchAndUpdateResults() {
  const btn = document.getElementById('fetch-results-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Загрузка...'; }

  try {
    const res = await fetch(`${PROXY_URL}/competitions/WC/matches`);
    if (res.status === 403) throw new Error('Прокси вернул 403 — проверь Worker и ключ в нём.');
    if (res.status === 429) throw new Error('Слишком много запросов. Попробуй через минуту.');
    if (!res.ok) throw new Error(`Ошибка прокси: ${res.status}`);

    const json = await res.json();
    const apiMatches = json.matches || [];

    let updated = 0;
    let timesFixed = 0;
    let confirmed = 0;
    apiMatches.forEach(apiM => {
      const apiHome = API_TEAM_MAP[apiM.homeTeam.name] || API_TEAM_MAP[apiM.homeTeam.shortName];
      const apiAway = API_TEAM_MAP[apiM.awayTeam.name] || API_TEAM_MAP[apiM.awayTeam.shortName];
      if (!apiHome || !apiAway) return;

      // Find local match by both teams in any order
      const local = data.matches.find(m =>
        (m.home === apiHome && m.away === apiAway) ||
        (m.home === apiAway  && m.away === apiHome)
      );
      if (!local) return;

      // Update kickoff time from API (utcDate is always UTC ISO string)
      if (apiM.utcDate && local.date !== apiM.utcDate) {
        local.date = apiM.utcDate;
        timesFixed++;
        pushApiLog(data, `🕐 Время: ${local.home} vs ${local.away} → ${fmtDate(apiM.utcDate)}`);
      }

      const h90 = apiM.score?.fullTime?.home;
      const a90 = apiM.score?.fullTime?.away;
      if (h90 === null || h90 === undefined || a90 === null || a90 === undefined) return;

      // Apply score in local home/away order
      const swapped = local.home === apiAway;
      const scoreHome = swapped ? a90 : h90;
      const scoreAway = swapped ? h90 : a90;

      // Determine winner for playoff matches
      let winner = null;
      if (local.round) {
        if (scoreHome !== scoreAway) {
          winner = scoreHome > scoreAway ? local.home : local.away;
        } else {
          // Draw → look at penalties/ET winner from API
          const apiWinner = apiM.score.winner; // 'HOME_TEAM' | 'AWAY_TEAM' | null
          if (apiWinner === 'HOME_TEAM') winner = swapped ? local.away : local.home;
          else if (apiWinner === 'AWAY_TEAM') winner = swapped ? local.home : local.away;
        }
      }

      const ex = local.result;

      // Protect manual corrections — API cannot overwrite
      if (ex?.manual) {
        if (ex.home === scoreHome && ex.away === scoreAway) {
          delete ex.manual;
          confirmed++;
          pushApiLog(data, `✅ Подтверждено: ${local.home} ${scoreHome}:${scoreAway} ${local.away} (✏️→API)`);
        }
        return;
      }

      // Skip if nothing changed
      if (ex && ex.home === scoreHome && ex.away === scoreAway && ex.winner === (winner || undefined)) return;

      const prevScore = ex ? `${ex.home}:${ex.away}` : 'нет';
      local.result = { home: scoreHome, away: scoreAway };
      if (winner) local.result.winner = winner;
      updated++;
      pushApiLog(data, `⚽ Результат: ${local.home} ${scoreHome}:${scoreAway} ${local.away}${ex ? ` (было ${prevScore})` : ''}`);

      // Auto-advance bracket for playoff
      if (local.round && BRACKET_NEXT[local.id] && winner) {
        const bn = BRACKET_NEXT[local.id];
        const loser = winner === local.home ? local.away : local.home;
        const nextM = data.matches.find(x => x.id === bn.next);
        if (nextM && nextM[bn.slot] === 'ТБД') nextM[bn.slot] = winner;
        if (bn.loserNext) {
          const loserM = data.matches.find(x => x.id === bn.loserNext);
          if (loserM && loserM[bn.loserSlot] === 'ТБД') loserM[bn.loserSlot] = loser;
        }
      }
    });

    if (updated > 0 || timesFixed > 0 || confirmed > 0) {
      saveData(data);
      renderLeaderboard();
      renderMatches();
      if (activeTab === 'admin') renderAdmin();
    }

    const hasExisting = Array.isArray(data.standings) && data.standings.length > 0;
    if ((updated > 0 || !hasExisting) && stateRef) {
      const st = getStandings(data).map(s => ({ name: s.name, points: s.total }));
      firebase.database().ref('wc2026/standings').set(st);
    }

    const parts = [];
    if (updated > 0) parts.push(`${updated} результатов`);
    if (timesFixed > 0) parts.push(`${timesFixed} времён`);
    if (confirmed > 0) parts.push(`${confirmed} ✏️→✅ подтверждено API`);
    alert(parts.length ? `✅ Обновлено: ${parts.join(', ')}` : `Изменений нет`);
  } catch (e) {
    alert(`Ошибка: ${e.message}`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Обновить результаты'; }
  }
}

// ===================== RENDER MATCHES =====================

function renderMatches() {
  const filters = ['upcoming','past','today','all','R32','R16','QF','SF','Final','A','B','C','D','E','F','G','H','I','J','K','L'];
  const filterLabels = {
    upcoming:'Предстоящие', past:'Прошедшие', today:'Сегодня', all:'Все',
    R32:'1/32', R16:'1/16', QF:'1/4', SF:'1/2', Final:'Финал',
  };
  // Group labels start from index 9
  filters.slice(9).forEach(g => filterLabels[g] = 'Гр. ' + g);

  let barHtml = '<div class="filter-bar">';
  filters.forEach(f => {
    barHtml += `<button class="filter-btn ${matchFilter===f?'act':''}" onclick="setMatchFilter('${f}')">${filterLabels[f]}</button>`;
  });
  barHtml += '</div>';

  const now = new Date();
  let filtered = data.matches.filter(m => {
    if (matchFilter === 'upcoming') return new Date(m.date) > now;
    if (matchFilter === 'past')     return new Date(m.date) <= now;
    if (matchFilter === 'today') {
      const d = new Date(m.date);
      return d.getDate() === now.getDate() && d.getMonth() === now.getMonth();
    }
    if (matchFilter === 'all')   return true;
    if (matchFilter === 'R32')   return m.round === 'R32';
    if (matchFilter === 'R16')   return m.round === 'R16';
    if (matchFilter === 'QF')    return m.round === 'QF';
    if (matchFilter === 'SF')    return m.round === 'SF';
    if (matchFilter === 'Final') return m.round === '3RD' || m.round === 'F';
    return m.group === matchFilter;
  });

  filtered.sort((a,b) => matchFilter === 'past'
    ? new Date(b.date) - new Date(a.date)   // past: newest first
    : new Date(a.date) - new Date(b.date)); // others: oldest first

  const fetchBtn = `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">
    <button id="fetch-results-btn" class="btn btn-sm btn-sec" onclick="fetchAndUpdateResults()">🔄 Обновить результаты</button>
  </div>`;
  let html = fetchBtn + barHtml;
  if (!filtered.length) {
    html += '<div class="empty-state">Матчей не найдено</div>';
  } else {
    filtered.forEach(m => { html += renderMatchCard(m); });
  }

  const prevScroll = document.querySelector('.filter-bar')?.scrollLeft || 0;
  document.getElementById('matches-content').innerHTML = html;
  const bar = document.querySelector('.filter-bar');
  if (bar) bar.scrollLeft = prevScroll;
}

function renderMatchCard(m) {
  const locked = isLocked(m);
  const dateStr = fmtDate(m.date);
  const isPlayoff = !!m.round;
  const badgeLabel = isPlayoff ? (PLAYOFF_ROUNDS[m.round] || m.round) : `Группа ${m.group}`;

  // Center column: locked score display OR editable inputs
  const inputStyle = `width:40px;height:38px;text-align:center;font-size:18px;font-weight:700;
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)`;

  const manualBadge = m.result?.manual ? ' <span style="font-size:11px;opacity:0.7">✏️</span>' : '';
  const centerHtml = m.result
    ? `<div class="match-result-score">${m.result.home} : ${m.result.away}${manualBadge}</div>`
    : `<div class="match-result-score" style="color:var(--text-dim)">— : —</div>`;

  const editBtn = m.result
    ? `<button onclick="editResult(${m.id})" style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px 6px;opacity:0.45;line-height:1" title="Исправить результат">✏️</button>`
    : '';

  let predHtml = '';
  if (PLAYERS.some(p => data.predictions[`${m.id}_${p}`] || m.result)) {
    predHtml = '<div class="pred-row">';
    PLAYERS.forEach(p => {
      const pred = data.predictions[`${m.id}_${p}`];
      if (!pred) {
        predHtml += `<span class="pred-chip no-bet" title="${p}: нет ставки">${p} –</span>`;
        return;
      }
      const score = `${pred.home} : ${pred.away}`;
      const apInfo = isPlayoff && pred.advancePick ? ` →${flag(pred.advancePick)}` : '';
      if (m.result) {
        const pts = calcPoints(pred, m.result, isPlayoff);
        const cls = pts>=5?'pts5':pts===4?'pts4':pts===3?'pts3':pts===2?'pts2':pts===1?'pts1':'pts0';
        predHtml += `<span class="pred-chip ${cls}" title="${p}: ${score}${apInfo}">${p} <span>${score}${apInfo}</span> <span class="pts-badge">+${pts}</span></span>`;
      } else {
        predHtml += `<span class="pred-chip" title="${p}: ${score}${apInfo}">${p} <span>${score}${apInfo}</span></span>`;
      }
    });
    predHtml += '</div>';
  }

  return `<div class="match-card">
    <div class="match-meta">
      <span class="match-group-badge${isPlayoff?' playoff-badge':''}">${badgeLabel}</span>
      <span class="match-date-str">${dateStr}${locked&&!m.result?' <span class="locked-badge">СТАРТ</span>':''}</span>
    </div>
    <div style="display:flex;align-items:center">
      <div class="match-teams-row" style="flex:1">
        <div class="match-team-side">
          <div class="match-flag">${flag(m.home)}</div>
          <div class="match-team-name">${m.home}</div>
        </div>
        ${centerHtml}
        <div class="match-team-side">
          <div class="match-flag">${flag(m.away)}</div>
          <div class="match-team-name">${m.away}</div>
        </div>
      </div>
      ${editBtn}
    </div>
    ${predHtml}
  </div>`;
}

function setMatchFilter(f) {
  matchFilter = f;
  renderMatches();
}

      html += `<div class="pick-row">
        <div class="pick-player">${p}</div>
        <div style="color:var(--text-dim)">${cur ? `${flag(cur)} ${cur}` : '— не выбрано —'}</div>
      </div>`;
    });
    html += `<button class="btn btn-sm" style="margin-top:10px" onclick="unlockTournamentPicks()">🔓 Разблокировать</button>`;
  } else {
    html += '<div class="admin-section-title">🏆 Выбор команды каждого игрока</div>';
    PLAYERS.forEach(p => {
      const cur = data.tournamentPicks[p] || '';
      html += `<div class="pick-row">
        <div class="pick-player">${p}</div>
        <select onchange="setTournamentPick('${p}',this.value)">
          <option value="">— не выбрано —</option>
          ${allTeams.map(t => `<option value="${t}" ${cur===t?'selected':''}>${flag(t)} ${t}</option>`).join('')}
        </select>
      </div>`;
    });
    html += `<button class="btn btn-sm btn-danger" style="margin-top:10px" onclick="lockTournamentPicks()">🔒 Заблокировать выбор навсегда</button>`;
  }
  html += '</div>';


  // API Log
  const log = Array.isArray(data.apiLog) ? data.apiLog : Object.values(data.apiLog || {});
  html += `<details style="margin-bottom:12px">
    <summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--text-dim);padding:8px 12px;background:var(--surface);border-radius:10px;list-style:none;display:flex;align-items:center;gap:6px">
      <span>▶</span> Лог обновлений API: football-data.org
    </summary>
    <div style="margin-top:6px;padding:10px 12px;background:var(--surface);border-radius:10px">`;
  if (!log.length) {
    html += '<div style="color:var(--text-dim);font-size:13px">Обновлений ещё не было</div>';
  } else {
    html += '<div style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">';
    log.forEach(entry => {
      const d = new Date(entry.ts);
      const timeStr = d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
      html += `<div style="display:flex;gap:8px;font-size:12px;padding:5px 8px;background:var(--surface2);border-radius:6px">
        <span style="color:var(--text-dim);white-space:nowrap;flex-shrink:0">${timeStr}</span>
        <span>${entry.desc}</span>
      </div>`;
    });
    html += '</div>';
  }
  html += '</div></details>';

  // Reset

  html += `<div class="sec-label">Опасная зона</div>
    <div class="admin-section">
      <div class="admin-section-title" style="color:var(--red)">⚠️ Сброс данных</div>
      <button class="btn btn-danger" onclick="resetAll()">Сбросить все данные</button>
    </div>`;

  document.getElementById('admin-content').innerHTML = html;
}

// ===================== RENDER PLAYOFF =====================

function renderPlayoff() {
  // Autocomplete: all real teams, prefixed by group position for quick lookup
  const teamOptions = new Set(Object.keys(TEAMS));
  // Also include teams already in playoff slots
  data.matches.filter(m => m.round).forEach(m => {
    if (TEAMS[m.home]) teamOptions.add(m.home);
    if (TEAMS[m.away]) teamOptions.add(m.away);
  });
  // Group standings hints: "1. Бразилия (Группа A)" etc — add as label in option
  const standingsHints = [];
  Object.keys(GROUPS_DEF).forEach(g => {
    calcGroupStandings(g).forEach((t, i) => {
      standingsHints.push({ team: t.team, pos: i + 1, group: g });
    });
  });
  const dl = document.getElementById('teams-list');
  if (dl) {
    // Sort: 3rd-place teams first (most useful for manual fill), then rest
    const thirds = standingsHints.filter(h => h.pos === 3).map(h => h.team);
    const sorted = [...thirds, ...[...teamOptions].filter(t => !thirds.includes(t)).sort()];
    dl.innerHTML = sorted.map(t => {
      const hint = standingsHints.find(h => h.team === t);
      const label = hint ? ` — ${hint.pos}-е место Группа ${hint.group}` : '';
      return `<option value="${t}" label="${t}${label}">`;
    }).join('');
  }

  let html = '';

  // Group standings (compact 2-column grid)
  html += '<div class="sec-label">Таблицы групп</div>';
  html += '<div class="admin-section">';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  Object.keys(GROUPS_DEF).forEach(g => {
    const st = calcGroupStandings(g);
    html += `<div style="background:var(--surface2);border-radius:8px;padding:8px;font-size:11px">
      <div style="font-weight:700;color:var(--accent);margin-bottom:4px">Группа ${g}</div>`;
    st.forEach((t, i) => {
      const pos = i === 0 ? '1' : i === 1 ? '2' : i === 2 ? '3' : '4';
      const gd = t.gf - t.ga;
      html += `<div style="display:flex;gap:4px;align-items:center;padding:2px 0;${i<2?'color:var(--text)':'color:var(--text-dim)'}">
        <span style="font-size:10px;min-width:10px">${pos}</span>
        <span style="flex:1">${flag(t.team)} ${t.team}</span>
        <span style="font-weight:700">${t.pts}оч</span>
        <span style="color:var(--text-dim)">${gd >= 0 ? '+' : ''}${gd}</span>
      </div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  html += `<button class="btn btn-sm" style="margin-top:12px;width:100%" onclick="populateR32()">
    ⚙️ Заполнить 1/16 из таблиц групп
  </button>`;
  html += '</div>';

  // Playoff match team editor — grouped by round
  html += '<div class="sec-label">Сетка плей-офф</div>';
  const roundOrder = ['R32','R16','QF','SF','3RD','F'];
  roundOrder.forEach(round => {
    const matches = data.matches
      .filter(m => m.round === round)
      .sort((a,b) => new Date(a.date) - new Date(b.date));
    if (!matches.length) return;
    html += `<div class="admin-section">
      <div class="admin-section-title">${PLAYOFF_ROUNDS[round] || round}</div>`;
    matches.forEach(m => {
      const hasResult = !!m.result;
      html += `<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)">
        <div style="font-size:10px;color:var(--text-dim);margin-bottom:5px">${fmtDate(m.date)}</div>
        <div style="display:flex;gap:6px;align-items:center;min-width:0">
          <input type="text" id="ph-${m.id}" value="${m.home}" placeholder="Команда 1"
            list="teams-list" autocomplete="off"
            onfocus="this.dataset.prev=this.value;this.value=''"
            onblur="if(!this.value.trim())this.value=this.dataset.prev"
            style="flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:12px">
          <span style="color:var(--text-dim);font-size:12px;flex-shrink:0">${hasResult ? `<strong>${m.result.home} : ${m.result.away}</strong>` : '—'}</span>
          <input type="text" id="pa-${m.id}" value="${m.away}" placeholder="Команда 2"
            list="teams-list" autocomplete="off"
            onfocus="this.dataset.prev=this.value;this.value=''"
            onblur="if(!this.value.trim())this.value=this.dataset.prev"
            style="flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:12px">
          <button class="btn btn-sm" onclick="savePlayoffTeams(${m.id})" style="flex-shrink:0">💾</button>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('playoff-content').innerHTML = html;
}

function setTournamentPick(player, team) {
  if (data.tournamentPicksLocked) return;
  if (team) data.tournamentPicks[player] = team;
  else delete data.tournamentPicks[player];
  saveData(data);
}

function editResult(matchId) {
  const pin = prompt('PIN:');
  if (pin === null) return;
  if (pin !== '3220') { alert('Неверный PIN'); return; }
  const m = data.matches.find(x => x.id === matchId);
  if (!m || !m.result) return;
  const h = prompt(`Хозяева (сейчас: ${m.result.home}):`, m.result.home);
  if (h === null) return;
  const a = prompt(`Гости (сейчас: ${m.result.away}):`, m.result.away);
  if (a === null) return;
  const hNum = parseInt(h), aNum = parseInt(a);
  if (isNaN(hNum) || isNaN(aNum)) { alert('Введи число'); return; }
  m.result = { home: hNum, away: aNum, manual: true };
  if (m.round && hNum !== aNum) m.result.winner = hNum > aNum ? m.home : m.away;
  saveData(data);
  renderMatches();
  renderLeaderboard();
}

function lockTournamentPicks() {
  const pin = prompt('PIN для блокировки:');
  if (pin === null) return;
  if (pin !== '3220') { alert('Неверный PIN'); return; }
  if (!confirm('Заблокировать выбор команд навсегда? Отменить будет невозможно!')) return;
  data.tournamentPicksLocked = true;
  saveData(data);
  renderAdmin();
}

function clearApiLog() {
  data.apiLog = [];
  saveData(data);
  renderAdmin();
}

function unlockTournamentPicks() {
  const pin = prompt('PIN для разблокировки:');
  if (pin === null) return;
  if (pin !== '3220') { alert('Неверный PIN'); return; }
  data.tournamentPicksLocked = false;
  saveData(data);
  renderAdmin();
}

function setWinner() {
  const v = document.getElementById('winner-select').value;
  data.tournamentWinner = v || null;
  saveData(data);
  renderAdmin();
  renderLeaderboard();
}

// Returns [{team, pts, w, d, l, gf, ga}, ...] sorted 1st→4th
function calcGroupStandings(groupId) {
  const teams = GROUPS_DEF[groupId];
  if (!teams) return [];
  const stats = {};
  teams.forEach(t => { stats[t] = {team:t,pts:0,w:0,d:0,l:0,gf:0,ga:0}; });
  data.matches
    .filter(m => m.group === groupId && m.result)
    .forEach(m => {
      const {home:h, away:a} = m.result;
      const hs = stats[m.home], as_ = stats[m.away];
      if (!hs || !as_) return;
      hs.gf += h; hs.ga += a; as_.gf += a; as_.ga += h;
      if (h > a)      { hs.pts += 3; hs.w++;  as_.l++; }
      else if (h < a) { as_.pts += 3; as_.w++; hs.l++;  }
      else            { hs.pts += 1; hs.d++; as_.pts += 1; as_.d++; }
    });
  return Object.values(stats).sort((a,b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    const gdDiff = (b.gf - b.ga) - (a.gf - a.ga);
    if (gdDiff !== 0) return gdDiff;
    return b.gf - a.gf;
  });
}

// Fill R32 team names from group standings (requires PIN)
function populateR32() {
  const pin = prompt('PIN для заполнения плей-офф:');
  if (pin === null) return;
  if (pin !== '3220') { alert('Неверный PIN'); return; }

  // Build slot→team map: 1X = winner, 2X = runner-up, 3X = third place of group X
  const slotToTeam = {};
  Object.keys(GROUPS_DEF).forEach(g => {
    const st = calcGroupStandings(g);
    if (st[0]) slotToTeam[`1${g}`] = st[0].team;
    if (st[1]) slotToTeam[`2${g}`] = st[1].team;
    if (st[2]) slotToTeam[`3${g}`] = st[2].team;
  });

  // Patch R32 match home/away — reset to slot name first, then fill with real team
  Object.entries(R32_SLOTS).forEach(([id, slots]) => {
    const m = data.matches.find(x => x.id === parseInt(id));
    if (!m) return;
    m.home = slotToTeam[slots.home] || slots.home;
    m.away = slotToTeam[slots.away] || slots.away;
  });

  saveData(data);
  if (activeTab === 'playoff') renderPlayoff();
  if (activeTab === 'admin') renderAdmin();
  if (activeTab === 'matches') renderMatches();
  alert('Сетка 1/32 заполнена из группового этапа!');
}

function saveResult(matchId) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  const h = parseInt(document.getElementById(`rh-${matchId}`).value);
  const a = parseInt(document.getElementById(`ra-${matchId}`).value);
  if (isNaN(h) || isNaN(a) || h < 0 || a < 0) { alert('Введи корректный счёт'); return; }

  // Determine winner for playoff matches
  let winner = null;
  if (m.round) {
    if (h !== a) {
      winner = h > a ? m.home : m.away;
    } else {
      const rwEl = document.getElementById(`rw-${matchId}`);
      if (rwEl && rwEl.value) winner = rwEl.value;
    }
  }
  m.result = {home: h, away: a};
  if (winner) m.result.winner = winner;

  // Auto-advance winner (and loser for SF→3rd) in knockout bracket
  if (m.round && BRACKET_NEXT[matchId] && winner) {
    const bn = BRACKET_NEXT[matchId];
    const loser = winner === m.home ? m.away : m.home;
    const nextM = data.matches.find(x => x.id === bn.next);
    if (nextM) nextM[bn.slot] = winner;
    if (bn.loserNext) {
      const loserM = data.matches.find(x => x.id === bn.loserNext);
      if (loserM) loserM[bn.loserSlot] = loser;
    }
  }

  saveData(data);
  renderLeaderboard();
  renderMatches();
  if (activeTab === 'admin') renderAdmin();
}

// Save manually edited playoff team names (from Admin)
function savePlayoffTeams(matchId) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  const h = document.getElementById(`ph-${matchId}`);
  const a = document.getElementById(`pa-${matchId}`);
  if (!h || !a) return;
  m.home = h.value.trim() || m.home;
  m.away = a.value.trim() || m.away;
  saveData(data);
  if (activeTab === 'playoff') renderPlayoff();
  if (activeTab === 'admin') renderAdmin();
  if (activeTab === 'matches') renderMatches();
}

function clearResult(matchId) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  m.result = null;
  saveData(data);
  renderLeaderboard();
  renderMatches();
  if (activeTab === 'admin') renderAdmin();
}

function saveFootballApiKey() {
  const pin = prompt('PIN для сохранения ключа:');
  if (pin === null) return;
  if (pin !== '3220') { alert('Неверный PIN'); return; }
  const key = (document.getElementById('football-api-key-input').value || '').trim();
  data.footballApiKey = key || null;
  saveData(data);
  alert(key ? '✅ API ключ сохранён.' : 'API ключ удалён.');
}

function resetAll() {
  const pin = prompt('Введи PIN для сброса данных:');
  if (pin === null) return;
  if (pin !== '3220') { alert('Неверный PIN'); return; }
  if (!confirm('Удалить ВСЕ данные? Это нельзя отменить!')) return;
  data = buildDefaultData();
  saveData(data);
  renderLeaderboard();
  renderAdmin();
}

// ===================== INIT =====================

function init() {
  document.getElementById('version-badge').textContent = VERSION;
  initFirebase(); // loads data, then calls renderLeaderboard + hideLoader
}

init();
</script>
