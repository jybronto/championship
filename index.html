<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЧМ 2026 — Прогнозы</title>
<style>
:root {
  --bg: #0c1520;
  --surface: #162030;
  --surface2: #1e2d3e;
  --surface3: #263545;
  --accent: #00e676;
  --accent-dim: #00b356;
  --text: #e4ecf5;
  --text-dim: #7a94ae;
  --border: #263545;
  --red: #ff4757;
  --gold: #ffd700;
  --orange: #ff9f00;
  --blue: #448aff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 68px;
}

/* ---- HEADER ---- */
header {
  background: linear-gradient(160deg, #0a3d20 0%, #162030 100%);
  padding: 12px 16px;
  border-bottom: 1px solid var(--accent-dim);
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }

/* ---- NAV ---- */
nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; z-index: 100;
}
nav button {
  flex: 1; background: none; border: none; color: var(--text-dim);
  padding: 8px 4px; font-size: 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color .2s;
}
nav button .ni { font-size: 22px; line-height: 1; }
nav button.act { color: var(--accent); }

/* ---- TABS ---- */
.tab { display: none; padding: 14px; }
.tab.act { display: block; }

/* ---- SECTION LABEL ---- */
.sec-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-dim); margin: 18px 0 10px;
}
.sec-label:first-child { margin-top: 0; }

/* ---- LEADERBOARD ---- */
.lb-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  transition: border-color .2s;
}
.lb-item.first-place { border-color: var(--gold); background: linear-gradient(135deg, #1a2010, #1e2d3e); }
.lb-item.second-place { border-color: #aaa; }
.lb-item.third-place { border-color: #a0522d; }
.lb-rank { font-size: 18px; width: 30px; text-align: center; flex-shrink: 0; }
.lb-info { flex: 1; min-width: 0; }
.lb-name { font-size: 15px; font-weight: 600; }
.lb-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-pts { font-size: 24px; font-weight: 700; color: var(--accent); min-width: 44px; text-align: right; }
.lb-pts-detail { font-size: 11px; color: var(--text-dim); text-align: right; }
.leader-tag {
  font-size: 10px; font-weight: 700; background: var(--gold); color: #000;
  border-radius: 8px; padding: 2px 7px; margin-left: 6px; vertical-align: middle;
}

/* ---- MATCH CARD ---- */
.match-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px; overflow: hidden;
}
.match-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.match-group-badge {
  font-size: 11px; background: var(--surface2); color: var(--accent);
  border-radius: 8px; padding: 2px 8px; font-weight: 600;
}
.match-date-str { font-size: 11px; color: var(--text-dim); }
.match-teams-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.match-team-side {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; flex: 1; text-align: center;
}
.match-flag { font-size: 32px; line-height: 1; }
.match-team-name { font-size: 12px; font-weight: 600; }
.match-vs {
  font-size: 13px; color: var(--text-dim); text-align: center;
  min-width: 56px; flex-shrink: 0;
}
.match-result-score {
  font-size: 26px; font-weight: 800; color: var(--text);
  text-align: center; line-height: 1;
}
.match-result-score.live { color: #ff4757; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.pred-row {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.pred-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 4px;
}
.pred-chip .pts-badge { font-weight: 700; }
.pred-chip.pts3 { background: #0d3321; border-color: var(--accent); }
.pred-chip.pts3 .pts-badge { color: var(--accent); }
.pred-chip.pts2 { background: #2a2200; border-color: var(--gold); }
.pred-chip.pts2 .pts-badge { color: var(--gold); }
.pred-chip.pts1 { background: #2a1500; border-color: var(--orange); }
.pred-chip.pts1 .pts-badge { color: var(--orange); }
.pred-chip.pts0 { background: #2a0d0d; border-color: var(--red); }
.pred-chip.pts0 .pts-badge { color: var(--red); }
.pred-chip.no-bet { opacity: .45; }
.locked-badge {
  font-size: 10px; color: var(--red); border: 1px solid var(--red);
  border-radius: 6px; padding: 1px 6px; margin-left: 4px;
}

/* ---- FILTER BAR ---- */
.filter-bar {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
  margin-bottom: 14px; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 16px; padding: 5px 12px; font-size: 12px;
  color: var(--text-dim); cursor: pointer; white-space: nowrap;
  transition: all .2s;
}
.filter-btn.act { background: #0d3321; border-color: var(--accent); color: var(--accent); }

/* ---- BET FORM (legacy, kept for already-bet display) ---- */
.already-bet {
  background: #0d3321; border: 1px solid var(--accent);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--accent); text-align: center; margin-bottom: 12px;
}
.bet-score-row input {
  width: 64px; height: 56px; text-align: center; font-size: 28px; font-weight: 700;
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text);
  transition: border-color .2s;
}
.bet-score-row input:focus { border-color: var(--accent); outline: none; }
.bet-colon { font-size: 28px; font-weight: 700; color: var(--text-dim); }
.bet-meta { font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 12px; }
.already-bet {
  background: #0d3321; border: 1px solid var(--accent);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--accent); text-align: center; margin-bottom: 12px;
}

/* ---- BUTTONS ---- */
.btn {
  background: var(--accent); color: #000; border: none;
  border-radius: 10px; padding: 13px 24px; font-size: 15px; font-weight: 700;
  cursor: pointer; width: 100%; transition: opacity .2s;
}
.btn:hover { opacity: .9; }
.btn-sec {
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border);
}
.btn-sec:hover { opacity: .8; }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm {
  padding: 8px 16px; font-size: 13px; width: auto;
}

/* ---- ADMIN ---- */
.admin-lock {
  text-align: center; padding: 60px 20px;
}
.admin-pin-input {
  width: 140px; height: 56px; text-align: center;
  font-size: 28px; letter-spacing: 10px; font-weight: 700;
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 12px; color: var(--text); margin: 16px auto; display: block;
}
.admin-pin-input:focus { border-color: var(--accent); outline: none; }
.admin-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; margin-bottom: 12px;
}
.admin-section-title {
  font-size: 13px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.result-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.result-row .team-name { flex: 1; font-size: 13px; }
.result-row input {
  width: 52px; height: 40px; text-align: center; font-size: 18px; font-weight: 700;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
}
.result-row input:focus { border-color: var(--accent); outline: none; }
.pick-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.pick-row .pick-player { flex: 1; font-size: 13px; font-weight: 600; }
.pick-row select {
  flex: 2; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 8px 10px; font-size: 13px;
}

/* ---- MISC ---- */
.warn-box {
  background: #2a1800; border: 1px solid var(--orange);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--orange); margin-bottom: 12px;
}
.info-box {
  background: #0d1e2a; border: 1px solid var(--blue);
  border-radius: 10px; padding: 10px 14px; font-size: 13px;
  color: var(--blue); margin-bottom: 12px; text-align: center;
}
.empty-state {
  text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 15px;
}
.badge-bonus {
  font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 7px;
  border: 1px solid var(--gold); color: var(--gold);
}
.badge-bonus.won { background: var(--gold); color: #000; }
.divider { height: 1px; background: var(--border); margin: 12px 0; }


/* 3-column standings grid */
.pg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.pg3-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 6px; text-align: center;
}
.pg3-card.pg3-gold { border-color: var(--gold); background: linear-gradient(160deg,#1e2a0a,#1e2d3e); }
.pg3-card.pg3-silver { border-color: #aaa; }
.pg3-card.pg3-bronze { border-color: #a0522d; }
.pg3-rank { font-size: 20px; line-height: 1; }
.pg3-name { font-size: 13px; font-weight: 700; margin: 5px 0 2px; }
.pg3-pts { font-size: 28px; font-weight: 800; color: var(--accent); line-height: 1; }
.pg3-sub { font-size: 10px; color: var(--text-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }

/* Multi-player bet panel */
.multi-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.multi-match-hdr { text-align: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.multi-match-teams { font-size: 16px; font-weight: 700; margin: 5px 0 3px; }
.multi-match-date { font-size: 12px; color: var(--text-dim); }

/* Compact 2-column bet grid */
.cbet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 8px 0; }
.cbet-cell {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 7px; background: var(--surface2);
  border-radius: 8px; min-height: 40px;
}
.cbet-name {
  font-size: 12px; font-weight: 600; min-width: 62px; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cbet-inputs { display: flex; align-items: center; gap: 3px; flex: 1; }
.cbet-inputs input {
  width: 32px; height: 32px; text-align: center;
  font-size: 15px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); transition: border-color .15s;
}
.cbet-inputs input:focus { border-color: var(--accent); outline: none; }
.cbet-sep { font-size: 13px; color: var(--text-dim); }
.cbet-done { font-size: 13px; font-weight: 700; color: var(--accent); flex: 1; text-align: center; }
.btn-clear-sm {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 3px 6px; color: var(--text-dim); font-size: 11px; cursor: pointer; flex-shrink: 0;
}
.btn-clear-sm:hover { border-color: var(--red); color: var(--red); }
.btn-save-sm {
  background: var(--accent); border: none; border-radius: 6px;
  padding: 3px 8px; color: #000; font-size: 13px; font-weight: 700;
  cursor: pointer; flex-shrink: 0; line-height: 1;
}
.btn-save-sm:active { opacity: .8; }

/* Bet rows accordion (Ставки tab) */
.bet-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 6px; overflow: hidden;
}
.bet-row-hdr {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; cursor: pointer; transition: background .15s;
  -webkit-user-select: none; user-select: none;
}
.bet-row-hdr:active { background: var(--surface2); }
.bet-row-teams {
  flex: 1; font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bet-row-date { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.bet-row-count { font-size: 11px; color: var(--accent); flex-shrink: 0; min-width: 28px; text-align: right; }
.bet-row-chevron { font-size: 10px; color: var(--text-dim); transition: transform .2s; flex-shrink: 0; }
.bet-row.expanded .bet-row-chevron { transform: rotate(180deg); }
.bet-row-body {
  display: none; padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
}
.bet-row.expanded .bet-row-body { display: block; }

/* Match nav dots */
.match-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.match-nav-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--text);
}
.match-nav-btn:disabled { opacity: .3; cursor: default; }
.match-nav-info { font-size: 12px; color: var(--text-dim); }

/* Mobile tweaks for very small screens */
@media (max-width: 360px) {
  .pg3-name { font-size: 11px; }
  .pg3-pts  { font-size: 22px; }
  .cbet-name { min-width: 52px; font-size: 11px; }
  .cbet-inputs input { width: 28px; height: 28px; font-size: 13px; }
  .bet-row-teams { font-size: 12px; }
  nav button { font-size: 9px; }
}
/* Desktop centering */
@media (min-width: 600px) {
  body { max-width: 600px; margin: 0 auto; }
  .pg3-pts { font-size: 30px; }
  .cbet-grid { gap: 7px; }
  .cbet-inputs input { width: 36px; height: 36px; font-size: 16px; }
}
</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<body>

<div id="loader" style="position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px">
  <div style="font-size:48px">⚽</div>
  <div style="color:var(--accent);font-size:16px;font-weight:600">Загрузка...</div>
</div>

<header>
  <div class="header-title">⚽ ЧМ 2026</div>
  <div id="version-badge" style="font-size:11px;color:var(--text-dim);font-family:monospace"></div>
</header>

<main>
  <div id="tab-lb" class="tab act"><div id="lb-content"></div></div>
  <div id="tab-matches" class="tab"><div id="matches-content"></div></div>
  <div id="tab-bets" class="tab"><div id="bets-content"></div></div>
  <div id="tab-admin" class="tab"><div id="admin-content"></div></div>
</main>

<nav>
  <button class="act" onclick="switchTab('lb',this)"><span class="ni">🏆</span>Таблица</button>
  <button onclick="switchTab('matches',this)"><span class="ni">📅</span>Матчи</button>
  <button onclick="switchTab('bets',this)"><span class="ni">✏️</span>Ставки</button>
  <button onclick="switchTab('admin',this)"><span class="ni">⚙️</span>Админ</button>
</nav>


<script>
// ===================== CONSTANTS =====================

const VERSION = 'v1.4';

  const matches = [];

    matches.push({id:id++,group:grp,home:T1,away:T3,date:dt[2],result:null,md:2});
    matches.push({id:id++,group:grp,home:T2,away:T4,date:dt[3],result:null,md:2});
    matches.push({id:id++,group:grp,home:T1,away:T4,date:dt[4],result:null,md:3});
    matches.push({id:id++,group:grp,home:T2,away:T3,date:dt[5],result:null,md:3});
  }
  return matches;
}

function normalizeData(val) {
  // Firebase turns arrays into objects with numeric keys — convert back
  if (val.matches && !Array.isArray(val.matches)) {
    val.matches = Object.values(val.matches);
  }
  if (!val.predictions)    val.predictions    = {};
  if (!val.tournamentPicks) val.tournamentPicks = {};
  if (!val.lockedBets)     val.lockedBets     = {};
  return val;
}

function initFirebase() {
  const configured = FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY';

  if (!configured) {
    // No Firebase yet — fall back to localStorage
    try { data = JSON.parse(localStorage.getItem('wc2026')) || buildDefaultData(); }
    catch(e) { data = buildDefaultData(); }
    hideLoader();
    return;
  }

  firebase.initializeApp(FIREBASE_CONFIG);
  stateRef = firebase.database().ref('wc2026');

  stateRef.on('value', snapshot => {
    const val = snapshot.val();
    if (!val) {
      data = buildDefaultData();
      stateRef.set(data);
    } else {
      data = normalizeData(val);
    }

    if (isFirstLoad) {
      isFirstLoad = false;
      hideLoader();
      renderLeaderboard();
    } else {
      renderTab(activeTab);
    }
  }, err => {
    console.error('Firebase:', err);
    data = buildDefaultData();
    hideLoader();
  });
}

function saveData(d) {
  data = d;

    stateRef.set(d);          // syncs to all connected devices instantly

// ===================== BUSINESS LOGIC =====================

function calcPoints(pred, result) {
  if (!pred || !result) return null;
  const {home:pH, away:pA} = pred;
  const {home:rH, away:rA} = result;
  if (pH === rH && pA === rA) return 3;
  if ((pH - pA) === (rH - rA)) return 2;
  if (Math.sign(pH - pA) === Math.sign(rH - rA)) return 1;
  return 0;
}

function getStandings(data) {
  const st = {};
  PLAYERS.forEach(p => { st[p] = {name:p, matchPts:0, bonusPts:0, team: data.tournamentPicks[p] || null}; });

  data.matches.forEach(m => {
    if (!m.result) return;
    PLAYERS.forEach(p => {
      const pred = data.predictions[`${m.id}_${p}`];
      const pts = calcPoints(pred, m.result);
      if (pts !== null) st[p].matchPts += pts;
    });
  });

  if (data.tournamentWinner) {
    PLAYERS.forEach(p => {
      if (data.tournamentPicks[p] === data.tournamentWinner) st[p].bonusPts += 10;
    });
  }

  return Object.values(st)
    .map(s => ({...s, total: s.matchPts + s.bonusPts}))
    .sort((a,b) => b.total - a.total);
}

function getLeaders(data) {
  const standings = getStandings(data);
  if (!standings.length) return [];
  const maxPts = standings[0].total;
  return standings.filter(s => s.total === maxPts).map(s => s.name);
}

function isLocked(match) {
  return new Date() >= new Date(match.date);
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const day = days[d.getDay()];
  const date = d.getDate();
  const mon = months[d.getMonth()];
  const h = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${day} ${date} ${mon}, ${h}:${min}`;
}

function flag(team) { return TEAMS[team] || '🏳️'; }

function getSortedMatches() {
  return [...data.matches].sort((a, b) => new Date(a.date) - new Date(b.date));
}

function getEffectiveMatchIdx() {
  const sorted = getSortedMatches();
  if (currentMatchIdx === -1) {
    const idx = sorted.findIndex(m => !isLocked(m));
    return idx >= 0 ? idx : sorted.length - 1;
  }
  return Math.max(0, Math.min(sorted.length - 1, currentMatchIdx));
}

function renderLeaderboard() {
  const standings = getStandings(data);
  const rankEmoji = ['🥇','🥈','🥉'];
  let html = '';

  if (data.tournamentWinner) {
    html += `<div class="info-box">🏆 Чемпион: ${flag(data.tournamentWinner)} <strong>${data.tournamentWinner}</strong></div>`;
  }

  // 3-column standings grid
  html += '<div class="sec-label">Турнирная таблица</div>';
  html += '<div class="pg3">';
  standings.forEach((s, i) => {
    const cls = i===0?'pg3-gold':i===1?'pg3-silver':i===2?'pg3-bronze':'';
    const isLeader = i === 0 && s.total > (standings[1]?.total ?? -1);
    html += `<div class="pg3-card ${cls}">
      <div class="pg3-rank">${rankEmoji[i] || (i+1)}</div>
      <div class="pg3-name">${s.name}${isLeader?' ★':''}</div>
      <div class="pg3-pts">${s.total}</div>
      <div class="pg3-sub">${s.team ? `${flag(s.team)} ${s.team}` : '—'}</div>
    </div>`;
  });
  html += '</div>';

  // Match panel — navigate through ALL matches, default = nearest upcoming
  const sorted = getSortedMatches();
  const idx = getEffectiveMatchIdx();
  const curMatch = sorted[idx];

  html += '<div class="sec-label">Матч</div>';
  if (sorted.length > 1) {
    html += `<div class="match-nav">
      <button class="match-nav-btn" onclick="moveBetMatch(-1)" ${idx===0?'disabled':''}>← Назад</button>
      <span class="match-nav-info">${idx+1} / ${sorted.length}</span>
      <button class="match-nav-btn" onclick="moveBetMatch(1)" ${idx===sorted.length-1?'disabled':''}>Вперёд →</button>
    </div>`;
  }

  if (curMatch) {
    if (isLocked(curMatch)) {
      html += renderMatchCard(curMatch);
    } else {
      html += renderMultiBetPanel(curMatch);
    }
  }

  // Rules
  html += `<div class="sec-label">Правила</div>
  <div class="admin-section" style="font-size:13px;color:var(--text-dim);line-height:1.9">
    🎯 Точный счёт — <strong style="color:var(--accent)">3 очка</strong><br>
    ↔️ Правильная разница голов — <strong style="color:var(--gold)">2 очка</strong><br>
    ✅ Угадал победителя — <strong style="color:var(--orange)">1 очко</strong><br>
    🏆 Чемпион турнира — <strong style="color:var(--gold)">+10 очков</strong><br>
    ⚠️ Лидер по очкам делает ставку <strong>первым!</strong>
  </div>`;

  document.getElementById('lb-content').innerHTML = html;
}

function renderMultiBetPanel(match) {

function moveBetMatch(dir) {
  const sorted = getSortedMatches();
  const cur = getEffectiveMatchIdx();
  currentMatchIdx = Math.max(0, Math.min(sorted.length - 1, cur + dir));
  renderLeaderboard();
}

function saveBetFor(matchId, player) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m || isLocked(m)) { alert('Матч уже начался! Ставки закрыты.'); return; }
  const hEl = document.getElementById(`bh-${matchId}-${player}`);
  const aEl = document.getElementById(`ba-${matchId}-${player}`);
  if (!hEl || !aEl) return;
  const h = Math.max(0, Math.min(20, parseInt(hEl.value) || 0));
  const a = Math.max(0, Math.min(20, parseInt(aEl.value) || 0));
  data.predictions[`${matchId}_${player}`] = { home: h, away: a, ts: Date.now() };
  saveData(data);
  renderLeaderboard();
  if (activeTab === 'matches') renderMatches();
  if (activeTab === 'bets') renderBets();
}

function submitAllBets(matchId) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m || isLocked(m)) { alert('Матч уже начался! Ставки закрыты.'); return; }

  let saved = 0;
  PLAYERS.forEach(p => {
    const hEl = document.getElementById(`bh-${matchId}-${p}`);
    const aEl = document.getElementById(`ba-${matchId}-${p}`);
    if (!hEl || !aEl) return; // already has a bet
    if (!hEl.dataset.touched && !aEl.dataset.touched) return; // not touched — skip
    const h = Math.max(0, Math.min(20, parseInt(hEl.value) || 0));
    const a = Math.max(0, Math.min(20, parseInt(aEl.value) || 0));
    data.predictions[`${matchId}_${p}`] = { home: h, away: a, ts: Date.now() };
    saved++;
  });

  if (!saved) { alert('Никто не заполнил ставку. Используй ✓ рядом с именем игрока.'); return; }
  data.lockedBets[matchId] = true;
  saveData(data);
  renderLeaderboard();
  if (activeTab === 'matches') renderMatches();
  if (activeTab === 'bets') renderBets();
}

function clearBetFor(matchId, player) {
  if (data.lockedBets && data.lockedBets[matchId] && !betsUnlocked) {
    alert('Ставки зафиксированы. Для изменений перейди во вкладку Ставки и введи PIN.');
    return;
  }
  delete data.predictions[`${matchId}_${player}`];
  if (data.lockedBets && data.lockedBets[matchId]) delete data.lockedBets[matchId];
  saveData(data);
  renderLeaderboard();
  if (activeTab === 'matches') renderMatches();
  if (activeTab === 'bets') renderBets();
}

function renderMatches() {
  const filters = ['upcoming','today','all','A','B','C','D','E','F','G','H','I','J','K','L'];
  const filterLabels = {upcoming:'Предстоящие',today:'Сегодня',all:'Все'};
  filters.slice(3).forEach(g => filterLabels[g] = 'Группа '+g);

  let barHtml = '<div class="filter-bar">';
  filters.forEach(f => {
    barHtml += `<button class="filter-btn ${matchFilter===f?'act':''}" onclick="setMatchFilter('${f}')">${filterLabels[f]}</button>`;
  });
  barHtml += '</div>';

  const now = new Date();
  let filtered = data.matches.filter(m => {
    if (matchFilter === 'upcoming') return new Date(m.date) > now;
    if (matchFilter === 'today') {
      const d = new Date(m.date);
      return d.getDate() === now.getDate() && d.getMonth() === now.getMonth();
    }
    if (matchFilter === 'all') return true;
    return m.group === matchFilter;
  });

  filtered.sort((a,b) => new Date(a.date) - new Date(b.date));

  let html = barHtml;
  if (!filtered.length) {
    html += '<div class="empty-state">Матчей не найдено</div>';
  } else {
    filtered.forEach(m => { html += renderMatchCard(m); });
  }
  document.getElementById('matches-content').innerHTML = html;
}

  }

  if (PLAYERS.some(p => data.predictions[`${m.id}_${p}`] || m.result)) {
    predHtml = '<div class="pred-row">';

      const pred = data.predictions[`${m.id}_${p}`];
      if (!pred) {
        predHtml += `<span class="pred-chip no-bet" title="${p}: нет ставки">${p} –</span>`;
        return;
      }
      const score = `${pred.home}:${pred.away}`;
      if (m.result) {
        const pts = calcPoints(pred, m.result);
        const cls = pts===3?'pts3':pts===2?'pts2':pts===1?'pts1':'pts0';
        predHtml += `<span class="pred-chip ${cls}" title="${p}: ${score}">${p} <span>${score}</span> <span class="pts-badge">+${pts}</span></span>`;
      } else {

      <span style="color:var(--text-dim)">:</span>
      <input type="number" id="ra-${m.id}" min="0" max="20" placeholder="0" onfocus="this.select()"
        style="width:44px;height:36px;text-align:center;font-size:17px;font-weight:700;

      <button class="btn btn-sm" style="flex:1" onclick="saveResult(${m.id})">✓ Сохранить</button>
    </div>`;
  } else if (m.result) {
    resultEntryHtml = `<div style="display:flex;align-items:center;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
      <span style="font-size:11px;color:var(--text-dim);flex-shrink:0">Изменить:</span>

    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="sec-label" style="margin:0">Ставки · 🔓 режим правки</span>
      <button class="btn-clear-sm" onclick="betsUnlocked=false;renderBets()">Выйти</button>
    </div>`;
  } else {
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="sec-label" style="margin:0">Ставки на матчи</span>
      <button class="btn btn-sm btn-sec" onclick="checkBetsPin()">🔓 Редактировать</button>
    </div>`;
  }

  if (!upcoming.length) {
    html += '<div class="empty-state">Нет предстоящих матчей</div>';
  } else {
    upcoming.forEach(m => {
      const betCount = PLAYERS.filter(p => data.predictions[`${m.id}_${p}`]).length;
      const isLockedBet = data.lockedBets && data.lockedBets[m.id];
      const d = new Date(m.date);
      const mon = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
      const dateStr = `${d.getDate()} ${mon} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

      html += `<div class="bet-row" data-mid="${m.id}">
        <div class="bet-row-hdr" onclick="toggleBetRow(${m.id})">
          <span class="bet-row-teams">${flag(m.home)} ${m.home} — ${flag(m.away)} ${m.away}</span>
          <span class="bet-row-date">${dateStr}</span>
          <span class="bet-row-count">${betCount}/7</span>
          <span style="font-size:12px">${isLockedBet ? '🔒' : ''}</span>
          <span class="bet-row-chevron">▼</span>
        </div>
        <div class="bet-row-body">
          ${renderBetInputs(m, betsUnlocked)}
          ${betsUnlocked ? `<button class="btn btn-sm" style="margin-top:8px" onclick="submitAllBets(${m.id})">💾 Зафиксировать</button>` : ''}
        </div>
      </div>`;
    });
  }

  document.getElementById('bets-content').innerHTML = html;
}

// ===================== RENDER ADMIN =====================

function renderAdmin() {
  let html = '';

  // Tournament picks
  html += '<div class="sec-label">Ставки на чемпиона</div>';
  html += '<div class="admin-section">';
  html += '<div class="admin-section-title">🏆 Выбор команды каждого игрока</div>';
  const allTeams = Object.keys(TEAMS).sort();
  PLAYERS.forEach(p => {
    const cur = data.tournamentPicks[p] || '';
    html += `<div class="pick-row">
      <div class="pick-player">${p}</div>
      <select onchange="setTournamentPick('${p}',this.value)">
        <option value="">— не выбрано —</option>
        ${allTeams.map(t => `<option value="${t}" ${cur===t?'selected':''}>${flag(t)} ${t}</option>`).join('')}
      </select>
    </div>`;
  });
  html += '</div>';

  // Tournament winner
  html += '<div class="sec-label">Победитель турнира</div>';
  html += '<div class="admin-section">';
  html += '<div class="admin-section-title">🥇 Установить чемпиона (после финала)</div>';
  const curWinner = data.tournamentWinner || '';
  html += `<select id="winner-select" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:14px;margin-bottom:10px">
    <option value="">— ещё не определён —</option>
    ${allTeams.map(t => `<option value="${t}" ${curWinner===t?'selected':''}>${flag(t)} ${t}</option>`).join('')}
  </select>`;
  html += `<button class="btn btn-sm" style="width:auto" onclick="setWinner()">Сохранить</button>`;
  html += '</div>';

  // Enter results — upcoming locked matches
  const lockedNoResult = data.matches
    .filter(m => isLocked(m) && !m.result)
    .sort((a,b) => new Date(a.date) - new Date(b.date))
    .slice(0, 20);

  if (lockedNoResult.length) {
    html += '<div class="sec-label">Ввод результатов</div>';
    lockedNoResult.forEach(m => {
      html += `<div class="admin-section">
        <div class="admin-section-title">Группа ${m.group} · ${fmtDate(m.date)}</div>
        <div class="result-row">
          <div class="team-name">${flag(m.home)} ${m.home}</div>
          <input type="number" id="rh-${m.id}" min="0" max="20" value="" placeholder="0">
          <div style="color:var(--text-dim)">:</div>
          <input type="number" id="ra-${m.id}" min="0" max="20" value="" placeholder="0">
          <div class="team-name" style="text-align:right">${flag(m.away)} ${m.away}</div>
        </div>
        <button class="btn btn-sm" onclick="saveResult(${m.id})">Сохранить результат</button>
      </div>`;
    });
  }

  // Edit already entered results
  const withResult = data.matches
    .filter(m => m.result)
    .sort((a,b) => new Date(b.date) - new Date(a.date))
    .slice(0, 10);

  if (withResult.length) {
    html += '<div class="sec-label">Изменить результаты</div>';
    withResult.forEach(m => {
      html += `<div class="admin-section">
        <div class="admin-section-title" style="font-size:12px">${flag(m.home)} ${m.home} ${m.result.home}:${m.result.away} ${flag(m.away)} ${m.away}</div>
        <div class="result-row">
          <input type="number" id="rh-${m.id}" min="0" max="20" value="${m.result.home}">
          <div style="color:var(--text-dim)">:</div>
          <input type="number" id="ra-${m.id}" min="0" max="20" value="${m.result.away}">
          <button class="btn btn-sm" style="flex-shrink:0" onclick="saveResult(${m.id})">💾</button>
          <button class="btn btn-sm btn-danger" style="flex-shrink:0" onclick="clearResult(${m.id})">✕</button>
        </div>
      </div>`;
    });
  }

  // Reset
  html += `<div class="sec-label">Опасная зона</div>
    <div class="admin-section">
      <div class="admin-section-title" style="color:var(--red)">⚠️ Сброс данных</div>
      <button class="btn btn-danger" onclick="resetAll()">Сбросить все данные</button>
    </div>`;

  document.getElementById('admin-content').innerHTML = html;
}

function setTournamentPick(player, team) {
  if (team) data.tournamentPicks[player] = team;
  else delete data.tournamentPicks[player];
  saveData(data);
}

function setWinner() {
  const v = document.getElementById('winner-select').value;
  data.tournamentWinner = v || null;
  saveData(data);
  renderAdmin();
  renderLeaderboard();
}

function saveResult(matchId) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  const h = parseInt(document.getElementById(`rh-${matchId}`).value);
  const a = parseInt(document.getElementById(`ra-${matchId}`).value);
  if (isNaN(h) || isNaN(a) || h < 0 || a < 0) { alert('Введи корректный счёт'); return; }
  m.result = {home: h, away: a};
  saveData(data);
  renderLeaderboard();
  renderMatches();
  if (activeTab === 'admin') renderAdmin();
}

function clearResult(matchId) {
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  m.result = null;
  saveData(data);
  renderLeaderboard();
  renderMatches();
  if (activeTab === 'admin') renderAdmin();
}

function resetAll() {
  if (!confirm('Удалить ВСЕ данные? Это нельзя отменить!')) return;
  data = buildDefaultData();
  saveData(data);
  renderLeaderboard();
  renderAdmin();
}

// ===================== INIT =====================

function init() {
  document.getElementById('version-badge').textContent = VERSION;
  initFirebase(); // loads data, then calls renderLeaderboard + hideLoader
}

init();
</script>
</body>
</html>
